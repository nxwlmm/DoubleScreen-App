# ============================================================
#  项目级 Gradle 配置
#  ⚠️ android.useAndroidX 是必需的：缺失时 AGP 会直接拒绝编译，
#     报错信息是 "This project uses AndroidX dependencies, but the
#     'android.useAndroidX' property is not enabled"，与"依赖写错"很像，
#     很容易误判成依赖问题而浪费半天。
# ============================================================

android.useAndroidX=true

# 非传递 R 类：每个模块只生成自己的 R，减少方法数与静态字段
# 低配设备上 dex 方法数直接关系到能否用 multidex-free 构建
android.nonTransitiveRClass=true

# Kotlin 官方代码风格
kotlin.code.style=official

# ------------------------------------------------------------
#  内存与并行
#  CI runner 是 2 核 7GB，2048m 堆足够；
#  Metaspace 显式限制，避免 Kotlin 编译器在大型构建中无限增长被 OOM Killer 干掉
# ------------------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# 构建扫描默认关闭：本工程不需要上传构建数据
org.gradle.daemon=true

# ------------------------------------------------------------
#  R8 说明
#  AGP 8.x 默认启用 R8 full mode（比 compat mode 激进得多：
#  允许类合并、更彻底的成员裁剪）。app/proguard-rules.pro 里的规则
#  是按 full mode 写的，不要再加 android.enableR8.fullMode=false —— 该属性
#  在 AGP 8 已移除，写了只会产生一条无意义的警告。
# ------------------------------------------------------------
