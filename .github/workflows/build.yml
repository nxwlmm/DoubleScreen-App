name: Build APKs

# ============================================================================
#  双端 APK 自动构建流水线
#
#  触发方式：
#    · push 到 main/master（只改 android/ 或本文件时才触发）
#    · 手动触发（Actions 页面 → Build APKs → Run workflow）
#
#  执行顺序：
#    ① 单元测试（core-source 的纯 JVM 测试）
#    ② 双端打包（leanback / mobile 并行，都依赖 ① 成功）
#    ③ 归档 APK 为 Artifact，供直接下载安装
#
#  ── v2 修订说明（针对首跑报错）────────────────────────────────────────────
#  首跑报错：Failed to find package 'tools'
#  根因：android-actions/setup-android@v3 会尝试通过 sdkmanager 安装 `tools` 包，
#        而 `tools`（旧版 SDK Tools）在较新的 Android SDK 仓库中已被移除，
#        该包不存在 → sdkmanager 返回非零 → 整个 job 失败。
#  修复：彻底移除 setup-android 这一步。ubuntu-latest runner **本身就预装了
#        Android SDK**（含 cmdline-tools / platform-tools / build-tools / 多个
#        platform），环境变量 ANDROID_SDK_ROOT 也已设好，我们唯一需要做的
#        只是「接受许可」，让 AGP 能自动补下缺失的 platform 组件。
# ============================================================================

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: '跳过单元测试（仅用于快速验证打包链路）'
        required: false
        default: false
        type: boolean

# 同一分支连续 push 时，取消上一次未跑完的构建，避免排队堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.7'
  JAVA_VERSION: '17'
  WORKING_DIR: 'android'
  # ubuntu-latest 预装的 SDK 位置；显式声明便于日志排查
  ANDROID_SDK_PATH: '/usr/local/lib/android/sdk'

jobs:

  # --------------------------------------------------------------------------
  # ① 单元测试：任何打包之前的质量闸门
  # --------------------------------------------------------------------------
  unit-test:
    name: ① 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # setup-gradle 接管 ~/.gradle 的缓存与并发控制，
      # 后续所有 gradlew 调用自动复用（首次冷启动约 3~5 分钟，之后约 1~2 分钟）
      - name: 配置 Gradle 与依赖缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: 准备 Android SDK（接受许可 + 预装组件）
        continue-on-error: true
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$ANDROID_SDK_PATH}}"
          echo "SDK 根目录: $SDK_ROOT"
          echo "--- 已装 platforms ---"; ls "$SDK_ROOT/platforms" 2>/dev/null || true
          echo "--- 已装 build-tools ---"; ls "$SDK_ROOT/build-tools" 2>/dev/null || true

          SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::未找到 sdkmanager（路径 $SDK_ROOT/cmdline-tools/*/bin），跳过；AGP 将尝试自行处理"
            exit 0
          fi
          echo "sdkmanager: $SDKMANAGER"

          # 接受全部 SDK 许可。yes 自动回答所有 y/N 提示；
          # 注意 yes 被提前关闭管道时会产生 SIGPIPE 非零退出码，故必须 || true
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # 预装本项目需要的组件。已存在时 sdkmanager 会立即返回，代价极小；
          # 不存在时避免后续 AGP 因自动下载受限而失败
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "SDK 准备完成"

      # ⚠️ 仓库里没有 gradle-wrapper.jar（二进制文件未入库），
      # 这里按需生成一次，否则 ./gradlew 会直接报 "No such file or directory"
      - name: 准备 Gradle Wrapper
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "未找到 gradlew，正在生成…"
            gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: 运行纯 JVM 单元测试
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}
        working-directory: ${{ env.WORKING_DIR }}
        run: ./gradlew :core-source:testDebugUnitTest --stacktrace --no-daemon

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/core-source/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # ② 电视版打包
  # --------------------------------------------------------------------------
  build-leanback:
    name: ② 打包 · 电视版
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置 Gradle 与依赖缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: 准备 Android SDK（接受许可 + 预装组件）
        continue-on-error: true
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$ANDROID_SDK_PATH}}"
          echo "SDK 根目录: $SDK_ROOT"
          echo "--- 已装 platforms ---"; ls "$SDK_ROOT/platforms" 2>/dev/null || true
          echo "--- 已装 build-tools ---"; ls "$SDK_ROOT/build-tools" 2>/dev/null || true

          SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::未找到 sdkmanager（路径 $SDK_ROOT/cmdline-tools/*/bin），跳过；AGP 将尝试自行处理"
            exit 0
          fi
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "SDK 准备完成"

      - name: 准备 Gradle Wrapper
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "未找到 gradlew，正在生成…"
            gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: 打包电视版 Release
        working-directory: ${{ env.WORKING_DIR }}
        run: ./gradlew :app:assembleLeanbackRelease --stacktrace --no-daemon

      # 产物重命名成可读名字：默认名是 app-leanback-release.apk，
      # 下载下来几个文件长得一模一样，用户分不清哪个是电视版
      - name: 整理产物
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in app/build/outputs/apk/leanback/release/*.apk; do
            cp "$f" "dist/DoubleScreen-TV-${GITHUB_SHA::7}.apk"
          done
          ls -lh dist/

      - name: 归档电视版 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-leanback-tv
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # --------------------------------------------------------------------------
  # ③ 手机版打包（与电视版并行执行）
  # --------------------------------------------------------------------------
  build-mobile:
    name: ③ 打包 · 手机版
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置 Gradle 与依赖缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: 准备 Android SDK（接受许可 + 预装组件）
        continue-on-error: true
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$ANDROID_SDK_PATH}}"
          echo "SDK 根目录: $SDK_ROOT"
          echo "--- 已装 platforms ---"; ls "$SDK_ROOT/platforms" 2>/dev/null || true
          echo "--- 已装 build-tools ---"; ls "$SDK_ROOT/build-tools" 2>/dev/null || true

          SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::未找到 sdkmanager（路径 $SDK_ROOT/cmdline-tools/*/bin），跳过；AGP 将尝试自行处理"
            exit 0
          fi
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "SDK 准备完成"

      - name: 准备 Gradle Wrapper
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "未找到 gradlew，正在生成…"
            gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: 打包手机版 Release
        working-directory: ${{ env.WORKING_DIR }}
        run: ./gradlew :app:assembleMobileRelease --stacktrace --no-daemon

      - name: 整理产物
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in app/build/outputs/apk/mobile/release/*.apk; do
            cp "$f" "dist/DoubleScreen-Phone-${GITHUB_SHA::7}.apk"
          done
          ls -lh dist/

      - name: 归档手机版 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-mobile-phone
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # --------------------------------------------------------------------------
  # ④ 结果汇总
  # --------------------------------------------------------------------------
  summary:
    name: ④ 构建汇总
    needs: [ unit-test, build-leanback, build-mobile ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 输出汇总
        run: |
          {
            echo "## 构建结果"
            echo ""
            echo "| 阶段 | 状态 |"
            echo "|---|---|"
            echo "| 单元测试 | ${{ needs.unit-test.result }} |"
            echo "| 电视版 APK | ${{ needs.build-leanback.result }} |"
            echo "| 手机版 APK | ${{ needs.build-mobile.result }} |"
            echo ""
            echo "### 下载方式"
            echo ""
            echo "回到本仓库页面 → **Actions** 标签 → 点进本次运行 →"
            echo "页面底部 **Artifacts** 区域，点击 \`apk-leanback-tv\` 或 \`apk-mobile-phone\` 下载。"
            echo ""
            echo "> APK 是 zip 打包的，下载后若为 .zip 请解压取出其中的 .apk 文件。"
          } >> "$GITHUB_STEP_SUMMARY"
